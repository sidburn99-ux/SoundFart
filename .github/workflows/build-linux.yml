# Build Linux AppImage de SoundFart.
# Declenche manuellement (workflow_dispatch) ou sur push de la branche
# feat/linux-appimage. Produit dist/SoundFart-<version>-x86_64.AppImage
# en artefact de workflow (aucune release GitHub creee automatiquement).
name: build-linux

on:
  workflow_dispatch:
  push:
    branches: [feat/linux-appimage]
    paths:
      - 'main.js'
      - 'main/**'
      - 'preload.js'
      - 'lib/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/**'
      - '.github/workflows/build-linux.yml'

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run dist:linux

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: soundfart-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 30
