<!DOCTYPE html>
<html lang="fr">
<head>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f1117; color: #e6e8ee; padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #8b93a7; font-size: 13px; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 12px; background: #1a1e2b; color: #9aa3b8; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  td { padding: 9px 12px; border-bottom: 1px solid #1f2333; vertical-align: top; }
  tr:hover td { background: #161a26; }
  .st { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .OK { background: #14532d; color: #4ade80; }
  .OK_TESTE_CLI { background: #1e3a5f; color: #60a5fa; }
  .A_TESTER { background: #713f12; color: #fbbf24; }
  .BUG { background: #7f1d1d; color: #f87171; }
  .IMPOSSIBLE { background: #3f3f46; color: #a1a1aa; }
  .date { color: #8b93a7; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .feat { font-weight: 600; }
  .note { color: #8b93a7; font-size: 12px; }
  .filters { margin-bottom: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .filters button { background: #1a1e2b; color: #c7cddb; border: 1px solid #2a3043; border-radius: 8px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .filters button.on { background: #3b4a7a; color: #fff; border-color: #4a5c96; }
</style>
</head>
<body>
<h1>SoundFart — Suivi des fonctionnalités</h1>
<div class="sub">Généré depuis <code>suivi.tsv</code> — ouvrir via <code>file:///</code>, aucun serveur requis.</div>
<div class="filters" id="filters"></div>
<table>
<thead><tr><th>Date</th><th>Fonctionnalité</th><th>Statut</th><th>Note</th></tr></thead>

</table>
<script>
const TSV = `date	feature	statut	note\n2026-11-13	Bibliotheque sons (import, categories, favoris, vignettes)	OK	Fichiers originaux jamais modifies\n2026-11-13	Diffusion audio vers Discord via VB-CABLE	OK	Web Audio -> CABLE Input\n2026-11-13	Pre-ecoute + monitoring peripherique	OK	Routing monId\n2026-11-13	Editeur (trim, fades, volume, normalisation, export MP3)	OK	ffmpeg bundle, coupe physique YouTube\n2026-11-13	Import YouTube (yt-dlp + ffmpeg)	OK	Telechargement paresseux tools/\n2026-11-13	Raccourcis clavier globaux par son + STOP global	OK	globalShortcut\n2026-11-13	Enregistreur multi-sources (micro + audio PC + cable)	OK	Mix + limiteur\n2026-11-13	Echo cancellation / noise suppression / AGC micro seul	OK	getUserMedia constraints\n2026-11-13	Bascule micro auto CABLE Output + restauration defaut Windows	OK	AudioEndpoint.exe, role multimedia en priorite\n2026-11-13	AudioTap.exe : loopback WASAPI -> CABLE Input	OK_TESTE_CLI	Capture/reinjecte teste en ligne de commande, non teste via UI\n2026-11-13	VB-CABLE bundlé + install silencieuse /S	A_TESTER	Installateur embarque, UAC auto, non teste sur machine sans cable\n2026-11-13	5 sons par defaut bundled (assets/sounds)	A_TESTER	Seed si bibliotheque vide\n2026-11-13	Menu F11 (Fichier/Edition/Audio/Affichage/Aide)	OK	Menu natif Electron\n2026-11-13	Regroupement par categorie dans Tous les sons	OK	Option topbar + menu\n2026-11-13	Version affichee a cote du nom	OK	v1.3.0 fallback HTML\n2026-11-14	Exe packagé quitte silencieusement	RESOLU	Faux positif : ELECTRON_RUN_AS_NODE=1 dans le shell de test, pas un bug app. Exe vérifié OK (fenêtre + processus)\n2026-11-14	Seed 5 sons sur profil frais	OK_PARTIEL	Migration ancienne config prioritaire (31 sons restaurés) ; seed non déclenché car bibliotheque non vide — comportement correct. Seed réel à valider sur machine sans ancienne config\n2026-11-14	Test en VM	IMPOSSIBLE	Pas d'hyperviseur sur la machine (pas de Hyper-V/VirtualBox/VMware)\n2026-11-14	Git versioning + AGENTS.md + suivi.tsv/html	OK	Infrastructure en place\n2026-10-14	Audit complet 3 subagents (main/app/preload/cs)	OK	~50 constats, 8 majeurs corriges\n2026-10-14	Fix hasVirtualCable trop large (VB-CABLE jamais installe)	OK	Match specifique « cable » requis\n2026-10-14	Fix UAC re-prompt a chaque lancement	OK	Snooze 7 jours (cable-install-snooze.json)\n2026-10-14	Fix autoSetup flicker + perte marqueur restore	OK	Early-return si deja sur cable, restoreFile conserve\n2026-10-14	Fix restoreMicNow roles console/comm separes	OK	Multi prioritaire, prev par role, unlink seulement si succes\n2026-10-14	Fix displayMedia rendait video pour requete audio-seule	OK	Respecte audioRequested/videoRequested\n2026-10-14	Fix onCableReady sans applyAudio + actx fuiter enregistreur	OK	resolveDevices+applyAudio, actx.close au stop\n2026-10-14	Correctifs differe (contexte): AudioTap parent-death, tapDead event, dedup compilations, normalizeCfg validation, applyAudio try/catch separes, PropVariantClear/RCW COM	A_FAIRE	Documente pour prochaine session\n2026-10-14	Watchdog micro: re-bascule auto si l'entree defaut quitte le cable	OK	setInterval 10s, check seulement si bascule active (restoreFile)\n2026-10-14	Correctifs audit: 31 bugs (main.js, app.js, AudioTap.cs)	OK	Recorder orphelin, races, fuites COM, validations, perfs\n2026-10-15	Installateur NSIS deux phases: VB-CABLE d'abord, reboot, puis app	OK	Phase1 cable present->install directe testee; phase2 simulee /S->install+launch+cleanup OK; reste test E2E reel cable absent+reboot\n2026-10-15	RunOnce post-reboot dans ensureCableDriver (filet securite runtime)	OK	armPostRebootRelaunch avant shutdown /r /t 60\n2026-10-15	Verification bascule micro: lancement+watchdog+restore	OK	3 roles cables au set; watchdog 10s; restore prouve live (G930 restaure a la fermeture); fix role multimedia ajoute aux checks\n2026-11-14	LOT1-1.1 Instance unique: app.exit(0) sans will-quit/restauration	Testé partiel	2e instance sortie verifiee (1 arbre de process); audio-restore.json factice reste intact; scenario micro/cable NON teste (VB-CABLE absent)\n2026-11-14	LOT1-1.2 AudioTap garde parent par temps (500ms) + StartTime anti-reutilisation PID	Testé réel	Parent tue (taskkill /F) -> tap detecte et sort en <=2s meme flux PCM actif\n2026-11-14	LOT1-1.3 AudioTap: erreurs fatales exit 2, refus boucle src=cable, downmix >2ch centre 0.707	NON testé	Compile csc OK; non verifie sur peripherique reel/deconnexion\n2026-11-14	LOT1-1.4 sf:tapDead expose (preload) + toast \"source Audio du PC perdue\" + stop enregistrement	NON testé	Code en place; pas de test kill reel du tap en session\n2026-11-14	LOT1-1.5 AudioTap mode PCM float32 48kHz stdout -> IPC -> AudioWorklet (anti-echo Discord)	Testé partiel	Flux PCM mesure reel: 2.5Mo en ~6s, peak=179205 pendant notify.wav (loopback capte audio systeme); appel Discord 2 pers NON teste\n2026-11-14	LOT1-1.6 AudioEndpoint guard <pid>: restauration micro a la mort du parent + uncaughtException	Testé partiel	Guard reel: parent tue -> restore execute + audio-restore.json supprime; kill SoundFart reel NON teste (cable absent)\n2026-11-14	LOT2-2.1 Watchdog async execFileP + anti-chevauchement + suspension session si micro change + reglage watchdogMic	Testé partiel	Code en place; pas de test reel (VB-CABLE absent -> watchdog jamais actif)\n2026-11-14	LOT2-2.2 Outils C# nommes par hash source (AudioEndpoint-<hash8>.exe), compile serialisee, purge anciens, csc absent -> erreur UI	Testé réel	AudioEndpoint-b90c242c.exe compile au lancement + get capture fonctionnel\n2026-11-14	LOT2-2.3 Telechargements: HTTPS only redirects, versions epinglees (yt-dlp 2026.10.26, ffmpeg 9.0.2), verification SHA-256, ensureFfmpeg single-flight, update yt-dlp 7j + retry import	NON testé	Sommes reelles verifiees en ligne; aucun telechargement reel teste\n2026-11-14	LOT2-2.4 bufCache borne en octets (256 Mo LRU) + warning fichiers >10min	NON testé	Code en place; pas de test OOM reel\n2026-11-14	LOT2-2.5 Garde IPC senderFrame (tous handlers), validations types/bornes, dir absolu, config .bak + .broken horodate	Testé partiel	22 handlers wrappes H(); node --check OK; pas de test d'intrusion\n2026-11-14	LOT2-2.6 CSP base-uri/form-action none, fallback version neutre, package.json files+author nettoyes	OK	Statique\n2026-11-14	DECISION portable-only: cible NSIS + build/installer.nsh + build/vbcable supprimes; VB-CABLE jamais embarque (licence VB-Audio); lien officiel vb-audio.com/Cable dans reglages	OK	package.json target=[portable]; dist ne produit plus que SoundFart.exe\n2026-11-14	LOT1-1.7 Bouton « Restaurer mon micro Windows » + audio:restore avec filet de secours (micro coince sur virtuel sans restore.json)	Testé partiel	Handler et UI en place; build portable lance OK (7 process, arret propre, pas de restore.json cree car cable absent)\n2026-11-14	THIRD-PARTY-NOTICES + AGENTS.md alignes: VB-CABLE non distribue, installe par l'utilisateur	OK	Doc a jour\n`;
const rows = TSV.trim().split('\n').slice(1).map(l => l.split('\t'));
const statuses = [...new Set(rows.map(r => r[2]))];
let filter = 'ALL';
const fdiv = document.getElementById('filters');
function renderFilters() {
  fdiv.innerHTML = '';
  ['ALL', ...statuses].forEach(s => {
    const b = document.createElement('button');
    b.textContent = s === 'ALL' ? 'Tous' : s;
    b.className = filter === s ? 'on' : '';
    b.onclick = () => { filter = s; renderFilters(); renderRows(); };
    fdiv.appendChild(b);
  });
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderRows() {
  document.getElementById('rows').innerHTML = rows
    .filter(r => filter === 'ALL' || r[2] === filter)
    .map(r => `<tr><td class="date">${esc(r[0])}</td><td class="feat">${esc(r[1])}</td><td><span class="st ${esc(r[2])}">${esc(r[2])}</span></td><td class="note">${esc(r[3]||'')}</td></tr>`)
    .join('');
}
renderFilters(); renderRows();
</script>
</body>
</html>
